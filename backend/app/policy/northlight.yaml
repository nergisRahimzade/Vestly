version: northlight-2026-06
company: Northlight Labs
materiality:
  # A difference above this amount goes to a person. At or below it, and only when the
  # trusted sources agree, Vestly drafts and asks for a routine approval.
  # UK and DE amounts are translated to USD at the period's reference rate before comparing.
  absolute: "25.00"
  currency: USD
  # These go to a person at any amount.
  always_escalate:
    - bank_detail_change
    - closed_period_effect
    - missing_grant_approval
    - forfeiture
    - unconfirmed_person
    - funding_mismatch
fx:
  band: "0.01"
privacy:
  # A department total covering fewer people than this shows headcount only.
  min_group_size: 3
contributions:
  US: "0.04"
  UK: "0.05"
  DE: "0.20"
# Simulated statutory rates. Real withholding depends on the person; these are flat
# so the synthetic books land on cents. Labeled as simulated in the demo.
statutory_rates:
  US:
    withholding: "0.20"
    employer_tax: "0.08"
  UK:
    withholding: "0.20"
    employer_tax: "0.10"
  DE:
    withholding: "0.25"
    employer_tax: "0.00"
# The actions each role may take through the policy gate. The model only ever sees the
# gate's answer: allowed, or refused with one of the rule ids below.
roles:
  agent: [read_scoped, compute, propose_entry, request_funding, hold_case, reject_duplicate,
          ask_human, request_document, request_reopen, propose_precedent]
  finance_mgr: [approve_entry]
  controller: [approve_entry, post_entry, lock_period, reopen_period, approve_bank_change,
               rule_precedent, advance_clock]
  treasury: [release_funding]
  hr_ops: [answer, update_bank_master, record_callback]
  hr_comp: [answer, enter_comp_change]
  legal: [answer, record_board_approval]
  payroll_provider: [answer]
  dept_head: [answer]
  auditor: []
  none: []
rules:
  ACC-1: An identity may only take the actions its role lists.
  SOD-1: The approver must differ from the requester and the preparer. Vestly is always a requester.
  SOD-2: Whoever entered a pay change cannot approve the payroll run that pays it.
  LIM-1: An entry or funding release above the approval limit needs two approvers, one of them the controller.
  BND-1: An approval covers the exact entry it was given for; any change to the amount, payee, account, period or case voids it.
  BNK-1: A bank-detail change needs a confirmed call-back logged within the call-back window before the pay run. Email is never enough.
  GRT-1: No stock expense without the board-approved grant on file.
  CTR-1: Employer contributions must equal the policy rate times eligible pay, to the cent.
  DUP-1: No entry for an item a live entry already books.
  CLS-1: Nothing posts into a locked period. Reopening is a controller action with a reason.
  PRV-1: Vestly reads one person's pay only inside an open case on that person.
controls:
  # LIM-1: an entry or funding release above this needs two approvers. Not the same
  # number as materiality, which decides who looks at a difference.
  approval_limit: "25000.00"
  approval_limit_currency: USD
  # BNK-1: a bank-detail change needs a call-back logged within this many days before the pay run.
  callback_window_days: 5
  # An unanswered question gets a reminder after this many days, and escalates after this many reminders.
  reminder_after_days: 2
  escalate_after_reminders: 2
  # Where an unanswered approval goes next.
  escalation:
    finance_mgr: controller
    treasury: controller
  # The simulated clock starts on the day the June drop arrives.
  clock_start: "2026-07-02"
facts:
  employment_dates:
    authority: hr
    ranking:
      - source: hr
        reason: HR is the system of record for employment status and dates.
      - source: payroll
        reason: The payroll register shows what was paid, not when employment ended.
      - source: equity
        reason: The equity platform is a process system. Its vesting flag is checked, not trusted.
      - source: ledger
        reason: The ledger shows what was booked. It does not settle a conflict with HR.
  authorized_compensation:
    authority: approved_compensation
    ranking:
      - source: approved_compensation
        reason: An approved compensation action is the authority for what pay was authorized.
      - source: payroll
        reason: The register shows what was paid, not what was approved.
  cash_moved:
    authority: bank
    ranking:
      - source: bank
        reason: The bank is the authority for cash that moved.
      - source: payroll
        reason: The register is the payment instruction, not proof the cash left.
  withholdings_on_a_completed_run:
    authority: payroll
    ranking:
      - source: payroll
        reason: On a completed run, the register is the authority for amounts withheld and employer taxes.
      - source: ledger
        reason: The ledger shows what was booked.
  grant_terms:
    authority: signed_grant
    ranking:
      - source: signed_grant
        reason: The signed grant and the board approval are the authority for grant terms.
      - source: equity
        reason: The equity platform is a process system.
  shares_outstanding:
    authority: grant_terms_and_hr
    ranking:
      - source: hr
        reason: HR supplies the termination date that stops unvested shares.
      - source: signed_grant
        reason: The grant terms say what was awarded and how it vests.
      - source: equity
        reason: The platform vesting flag is checked, not trusted on its own.
  books:
    authority: ledger
    ranking:
      - source: ledger
        reason: The ledger is the record of what was booked. It is not the authority for HR or cash.
  pay_destination:
    authority: hr
    email_is_source: false
    ranking:
      - source: hr
        reason: The HR bank master is the authority for where net pay is sent, after dual approval.
      - source: email
        reason: Email is not a source for a bank-detail change.
  gbp_usd_translation:
    authority: reference_rate
    ranking:
      - source: reference_rate
        reason: The reference rate is what the band is measured from.
      - source: management_pack
        reason: The management pack shows the rate that was used. Inside the band, the difference is explained.
      - source: ledger
        reason: Entity books stay in their own currency. A translation difference does not rewrite them.
